services:
  - type: web
    name: aldeia-imoveis
    runtime: static
    buildCommand: ""
    staticPublishPath: public
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
